[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.12.0"
edition = "2024"
repository = "https://github.com/guscatalano/Groundhog"

[profile.release]
# The agent gets copied into every VM; keep it small.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
