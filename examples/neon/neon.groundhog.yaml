# A quiet, dark Windows with a neon city on the desktop, VS Code, PowerShell 7 in a Terminal
# dressed to match, and two tools: Heisenberg (an MCP server for debugging Windows) and
# FindNeedle (fast log search). Small on purpose: no SDKs, no runtimes (the tools are
# self-contained), nothing that needs a restart.
#
#   & ([scriptblock]::Create((irm https://github.com/guscatalano/Groundhog/releases/latest/download/apply.ps1))) https://raw.githubusercontent.com/guscatalano/Groundhog/main/examples/neon/neon.groundhog.yaml
#
# Everything shows at once (Explorer restarts once at the end, for the taskbar and desktop).

agent: ">=0.31.0"

# No setup nags, tips, ads, widgets or web results in search.
extends: groundhog:quiet-windows

# Not on this machine: OneDrive (and its backup nags), Teams, Xbox and its Game Bar.
remove-apps: [OneDrive, Microsoft Teams, Game Bar, Xbox]

apps:
  - id: Microsoft.VisualStudioCode
    args: --scope machine           # for every account, with a Start menu entry for all
  - Microsoft.PowerShell              # PowerShell 7

files:
  - from: github:guscatalano/Heisenberg@latest/heisenberg.exe
    to: C:\Program Files\Heisenberg\heisenberg.exe
  # FindNeedle publishes every build as a prerelease; release.zip is the self-contained app.
  - from: github:guscatalano/findneedle@latest/release.zip
    prerelease: true
    to: C:\Program Files\FindNeedle
    extract: true

path:
  - dir: C:\Program Files\Heisenberg
    scope: machine

desktop:
  theme: dark
  wallpaper: neon-city.jpg            # rendered by make-wallpaper.py, next to this file
  wallpaper-style: fill
  taskbar:
    search: icon
    task-view: false
    widgets: false
    # Only these: Windows' own pins (Edge, Store, Outlook, ...) go.
    pins:
      - terminal
      - '%ALLUSERSPROFILE%\Microsoft\Windows\Start Menu\Programs\FindNeedle.lnk'
      - '%ALLUSERSPROFILE%\Microsoft\Windows\Start Menu\Programs\Visual Studio Code\Visual Studio Code.lnk'
  start:
    # Terminal, PowerShell 7, VS Code, FindNeedle, File Explorer and Settings, pinned by hand on
    # a sandbox and saved with `groundhog-agent capture start-pins`
    pins-from: start2.bin
    recently-added: false
    recommendations: false
    recommended-files: false
    folders: [file-explorer, downloads, settings]
  icons:
    this-pc: true
    recycle-bin: true
    add:
      - { name: FindNeedle, target: 'C:\Program Files\FindNeedle\FindNeedleUX.exe' }
      - { name: VS Code, target: 'C:\Program Files\Microsoft VS Code\Code.exe' }
    remove: [Microsoft Edge]
  notifications:
    sounds: false
  scope: [current-user, default-user]

# Terminal opens PowerShell 7, in the wallpaper's colours, over the desktop.
terminal:
  default-terminal: terminal          # console programs open in Terminal too
  default-profile: PowerShell         # PowerShell 7's profile
  theme: dark
  font: { face: Cascadia Code, size: 12 }
  color-scheme: Neon City
  profile-defaults: { opacity: 82, useAcrylic: false, cursorShape: filledBox, padding: '12' }
  settings:
    schemes:
      - name: Neon City
        background: '#0C0418'
        foreground: '#E8E0FF'
        cursorColor: '#FF2A6D'
        selectionBackground: '#823CFF'
        black: '#0C0418'
        red: '#FF2A6D'
        green: '#05D9E8'
        yellow: '#FFBE3C'
        blue: '#823CFF'
        purple: '#D14BFF'
        cyan: '#05D9E8'
        white: '#E8E0FF'
        brightBlack: '#4A3A6A'
        brightRed: '#FF5C8F'
        brightGreen: '#6FF3FF'
        brightYellow: '#FFD580'
        brightBlue: '#A67CFF'
        brightPurple: '#E58CFF'
        brightCyan: '#6FF3FF'
        brightWhite: '#FFFFFF'

# A prompt in the same colours, for both PowerShells.
powershell:
  execution-policy: RemoteSigned      # so PowerShell runs the profile
  profile: |
    function prompt {
      $e = [char]27
      $where = (Get-Location).Path.Replace($HOME, '~')
      "$e[38;2;5;217;232m$env:USERNAME$e[0m $e[38;2;130;60;255m$where$e[0m`n$e[38;2;255;42;109m$([char]0x276F)$e[0m "
    }
    Set-PSReadLineOption -Colors @{ Command = '#05D9E8'; Parameter = '#823CFF'; String = '#FFBE3C'; Operator = '#FF2A6D' }

run:
  - command: |
      # A Start menu entry for FindNeedle (the zip has no installer to make one)
      $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\FindNeedle.lnk"
      $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
      $s.TargetPath = 'C:\Program Files\FindNeedle\FindNeedleUX.exe'
      $s.WorkingDirectory = 'C:\Program Files\FindNeedle'
      $s.Description = 'Search through logs'
      $s.Save()

verify:
  - file: C:\Program Files\Heisenberg\heisenberg.exe
  - file: C:\Program Files\FindNeedle\FindNeedleUX.exe
  - file: '%ALLUSERSPROFILE%\Microsoft\Windows\Start Menu\Programs\Visual Studio Code\Visual Studio Code.lnk'
