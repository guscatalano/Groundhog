# Firefox for every account, with uBlock Origin and Bitwarden from addons.mozilla.org, and
# without the terms screen, the first-run tour, the "make Firefox your default" prompt,
# sponsored shortcuts and stories, recommendations, telemetry or studies. Firefox reads these
# as enterprise policies (about:policies lists them) and installs the extensions when it next
# starts; they stay up to date by themselves. On its first start Firefox still asks Windows
# to pin it to the taskbar: no policy turns that off.
#
#   groundhog-agent apply groundhog:firefox
#
# Your own add-ons, by the name at the end of their addons.mozilla.org page's address
# (addons.mozilla.org/firefox/addon/darkreader): extend this and add or remove some.
#
#   extends: groundhog:firefox
#   firefox:
#     extensions:
#       add: [darkreader, react-devtools]
#       remove: [bitwarden-password-manager]

agent: ">=0.23.0"

apps:
  - id: Mozilla.Firefox
    args: --scope machine

firefox:
  extensions:
    add:
      - ublock-origin                  # blocks ads and trackers
      - bitwarden-password-manager     # the password manager

registry:
  # Quiet: no terms screen, tour, default-browser prompt, telemetry or studies.
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox', name: SkipTermsOfUse, type: dword, value: 1 }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox', name: DontCheckDefaultBrowser, type: dword, value: 1 }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox', name: DisableTelemetry, type: dword, value: 1 }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox', name: DisableFirefoxStudies, type: dword, value: 1 }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox', name: OverrideFirstRunPage, value: '' }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox', name: OverridePostUpdatePage, value: '' }
  # No onboarding, and no recommendations.
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox\UserMessaging', name: SkipOnboarding, type: dword, value: 1 }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox\UserMessaging', name: ExtensionRecommendations, type: dword, value: 0 }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox\UserMessaging', name: FeatureRecommendations, type: dword, value: 0 }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox\UserMessaging', name: MoreFromMozilla, type: dword, value: 0 }
  # A plain new tab: no sponsored shortcuts or stories.
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox\FirefoxHome', name: SponsoredTopSites, type: dword, value: 0 }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox\FirefoxHome', name: SponsoredPocket, type: dword, value: 0 }
  - { key: 'HKLM\SOFTWARE\Policies\Mozilla\Firefox\FirefoxHome', name: Pocket, type: dword, value: 0 }

verify:
  - file: '%ProgramFiles%\Mozilla Firefox\firefox.exe'
