# Explorer for people who poke at the system: file extensions, hidden files, protected
# operating system files, and full paths in the title bar. For this user and new ones;
# takes effect at the next logon (or when Explorer restarts).

registry:
  - key: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    name: HideFileExt
    type: dword
    value: 0
    scope: [current-user, default-user]
  - key: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    name: Hidden
    type: dword
    value: 1
    scope: [current-user, default-user]
  - key: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    name: ShowSuperHidden
    type: dword
    value: 1
    scope: [current-user, default-user]
  - key: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState
    name: FullPath
    type: dword
    value: 1
    scope: [current-user, default-user]
