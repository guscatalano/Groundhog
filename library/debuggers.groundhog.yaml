# Debugging Tools for Windows: cdb, kd, ntsd, gflags, umdh, symchk, dbgsrv and friends, the
# console debuggers scripts and agents drive. Only that feature of the Windows SDK is
# installed, and its folder goes on the machine PATH.

agent: ">=0.11.0"   # machine-scope env and PATH

apps:
  - id: Microsoft.WindowsSDK.10.0.28000
    args: --override "/features OptionId.WindowsDesktopDebuggers /quiet /norestart /ceip off"
    timeout: 30m

path:
  - dir: C:\Program Files (x86)\Windows Kits\10\Debuggers\x64
    scope: machine

verify:
  - file: C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe
  - file: C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\gflags.exe
