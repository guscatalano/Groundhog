# Debugging Tools for Windows: cdb, kd, ntsd, gflags, umdh, symchk, dbgsrv and friends, the
# console debuggers scripts and agents drive. Only that feature of the Windows SDK is
# installed, and the folder for this machine's architecture goes on the machine PATH.

agent: ">=0.14.0"   # ${var:arch}

apps:
  - id: Microsoft.WindowsSDK.10.0.28000
    args: --override "/features OptionId.WindowsDesktopDebuggers /quiet /norestart /ceip off"
    timeout: 30m

path:
  - dir: C:\Program Files (x86)\Windows Kits\10\Debuggers\${var:arch}
    scope: machine

verify:
  - file: C:\Program Files (x86)\Windows Kits\10\Debuggers\${var:arch}\cdb.exe
  - file: C:\Program Files (x86)\Windows Kits\10\Debuggers\${var:arch}\gflags.exe
